            <form 
                action="mailto:jmmauto.id@gmail.com?subject=Message%20from%20Website" 
                method="POST" 
                enctype="text/plain"

                type="text" 
                name="Full Name" 
                data-lang-placeholder="contactus-fullname" 
                placeholder="Full Name" 
                required
                >

                <input 
                type="email" 
                name="Email" 
                data-lang-placeholder="contactus-email" 
                placeholder="Email" 
                required

                <input

                required
